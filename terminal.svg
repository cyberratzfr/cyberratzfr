<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#19BEFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; font-size: 17px; }
      .prompt { fill: #19BEFF; font-weight: 700; }
      .cmd    { fill: #EAF1F5; }
      .out    { fill: #8FA3B3; }
      .red    { fill: #FF5A5A; font-weight: 700; }
      .tag    { fill: #19BEFF; font-size: 13px; letter-spacing: 2px; font-weight: 700; }
      .cyan   { fill: #45E4FF; }
      .l { opacity: 0; animation: show 0.01s forwards; }
      .l1 { animation-delay: 0.4s; } .l2 { animation-delay: 1.2s; }
      .l3 { animation-delay: 2.0s; } .l4 { animation-delay: 2.8s; }
      .l5 { animation-delay: 3.6s; } .l6 { animation-delay: 4.4s; }
      .l7 { animation-delay: 5.2s; }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes show  { to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect x="6" y="6" width="848" height="288" rx="10" fill="#030405"/>
  <rect x="6" y="6" width="848" height="288" rx="10" fill="url(#grid)"/>
  <rect x="6" y="6" width="848" height="288" rx="10" fill="none" stroke="#19BEFF" stroke-width="1.5" filter="url(#glow)"/>

  <!-- header -->
  <line x1="6" y1="44" x2="854" y2="44" stroke="#19BEFF" stroke-opacity="0.35"/>
  <circle cx="30" cy="25" r="5" fill="#FF5A5A"/>
  <circle cx="48" cy="25" r="5" fill="#19BEFF" fill-opacity="0.5"/>
  <circle cx="66" cy="25" r="5" fill="#45E4FF" fill-opacity="0.5"/>
  <text x="836" y="30" text-anchor="end" class="tag">[ROOT@RATZ] ■ SESSION</text>

  <!-- body -->
  <text x="28" y="80"  class="l l1"><tspan class="prompt">root@ratz:~#</tspan><tspan class="cmd"> whoami</tspan></text>
  <text x="28" y="108" class="l l2 out">&gt; CyberRatz — collectif FR de hackers éthiques</text>
  <text x="28" y="146" class="l l3"><tspan class="prompt">root@ratz:~#</tspan><tspan class="cmd"> cat skills.txt</tspan></text>
  <text x="28" y="174" class="l l4 out">&gt; PENTEST · RED TEAM · BUG HUNTER · OSINT · LINUX</text>
  <text x="28" y="212" class="l l5"><tspan class="prompt">root@ratz:~#</tspan><tspan class="cmd"> echo $MOTTO</tspan></text>
  <text x="28" y="240" class="l l6"><tspan class="red">&gt; No system is safe.</tspan><tspan class="cyan"> ■</tspan></text>
  <g class="l l7">
    <text x="28" y="276"><tspan class="prompt">root@ratz:~#</tspan></text>
    <rect x="162" y="262" width="10" height="18" fill="#19BEFF" class="cursor"/>
  </g>
</svg>
